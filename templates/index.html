<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Python Task Manager</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: #fff; padding: 30px; border-radius: 12px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        form { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 8px 15px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; align-items: center; }
        .delete { color: #e74c3c; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Менеджер задач</h2>
        <form action="/add" method="POST">
            <input type="text" name="title" placeholder="Новая задача..." required>
            <button type="submit">Добавить</button>
        </form>
        <ul>
            {% for task in tasks %}
            <li>
                <span>{% if task.completed %}[Готово]{% else %}[В работе]{% endif %} {{ task.title }}</span>
                <div>
                    <a href="/toggle/{{ task.id }}">Изменить</a> | 
                    <a href="/delete/{{ task.id }}" class="delete">Удалить</a>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
